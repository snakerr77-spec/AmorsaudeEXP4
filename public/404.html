<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Página não encontrada | LAG Controller</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#062653;background:#f6f9fc}
    *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 0,rgba(18,184,186,.1),transparent 28rem),#f6f9fc}
    main{width:min(520px,100%);padding:36px;border:1px solid #dce6ee;border-radius:20px;background:#fff;box-shadow:0 18px 50px rgba(7,39,82,.09);text-align:center}
    .icon{width:68px;height:68px;margin:0 auto 18px;display:grid;place-items:center;border-radius:20px;background:#edfafa;color:#00878b;font-size:26px;font-weight:800}
    h1{margin:0 0 10px;font-size:28px}p{margin:0 0 22px;color:#60748d;line-height:1.6}
    a{display:inline-flex;min-height:44px;align-items:center;justify-content:center;padding:0 20px;border-radius:10px;color:#fff;background:linear-gradient(135deg,#00878b,#12b8ba);font-weight:700;text-decoration:none}
  </style>
</head>
<body>
  <main>
    <div class="icon">404</div>
    <h1>Página não encontrada</h1>
    <p>O endereço acessado não existe ou foi alterado.</p>
    <a href="/pages/home.html">Voltar para o painel</a>
  </main>
</body>
</html>
