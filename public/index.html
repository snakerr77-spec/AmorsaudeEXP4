<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=/pages/login.html">
  <title>LAG Controller</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#f5fbff,#e7f8fa);color:#102a43}.box{width:min(420px,calc(100% - 32px));padding:32px;border:1px solid #d8e9f0;border-radius:24px;background:#fff;box-shadow:0 24px 60px rgba(16,42,67,.12);text-align:center}.mark{width:58px;height:58px;margin:0 auto 16px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,#0f9da8,#1d7df2);color:#fff;font-size:28px;font-weight:800}.box strong{display:block;font-size:22px;margin-bottom:8px}.box p{margin:0 0 18px;color:#60758c}.box a{display:inline-flex;padding:12px 18px;border-radius:12px;background:#0f9da8;color:#fff;text-decoration:none;font-weight:800}
  </style>
</head>
<body>
  <main class="box">
    <div class="mark">L</div>
    <strong>LAG Controller</strong>
    <p>Redirecionando para o acesso seguro...</p>
    <a href="/pages/login.html">Abrir login</a>
  </main>
  <script>window.location.replace('/pages/login.html');</script>
</body>
</html>
