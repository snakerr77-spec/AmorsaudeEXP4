name = "amorsaudeexp4"
main = "src/worker.js"
compatibility_date = "2026-07-30"
workers_dev = true
preview_urls = true
keep_vars = true

[observability]
enabled = true
head_sampling_rate = 1.0

[vars]
FREE_EDIT_MODE = "false"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api", "/api/*"]
not_found_handling = "404-page"

# Cloudflare/Wrangler cria automaticamente um D1 na primeira implantação.
# O binding precisa continuar exatamente como DB porque o Worker usa env.DB.
[[d1_databases]]
binding = "DB"
