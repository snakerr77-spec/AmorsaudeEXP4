<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amor Saúde</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, Helvetica, sans-serif;
      background: #eefdff;
      color: #102a43;
    }
    .box {
      background: #ffffff;
      padding: 28px 34px;
      border-radius: 22px;
      box-shadow: 0 20px 55px rgba(16, 42, 67, 0.14);
      text-align: center;
    }
    .box strong {
      display: block;
      font-size: 20px;
      margin-bottom: 8px;
      color: #27aeb8;
    }
    .box p {
      margin: 0;
      color: #60758c;
    }
  </style>
</head>
<body>
  <div class="box">
    <strong>Amor Saúde</strong>
    <p>Validando acesso...</p>
  </div>

  <script>
    const API_URL = "https://little-fog-b415amorsaude-api.snakerr77.workers.dev";
    const HOME_URL = "/pages/home.html";
    const LOGIN_URL = "/pages/login.html";

    function limparSessaoCloud() {
      [
        "amor_token",
        "amor_token_expira_em",
        "amor_email",
        "usuarioEmail",
        "amor_usuario",
        "amorSaudeUsuario",
        "usuarioLogado",
        "amor_nivel_acesso",
        "nivelAcesso",
        "amor_cidade",
        "cidadeSelecionada",
        "amorSaudeLogado",
        "isLoggedIn",
        "firebaseUser",
        "firebaseAuth",
        "firebaseUID"
      ].forEach((chave) => localStorage.removeItem(chave));

      sessionStorage.removeItem("amorSaudeSessaoAtiva");
    }

    async function iniciar() {
      const token = localStorage.getItem("amor_token") || "";
      const email =
        localStorage.getItem("amor_email") ||
        localStorage.getItem("usuarioEmail") ||
        "";

      if (!token) {
        localStorage.setItem("amorSaudeRedirectAfterLogin", HOME_URL);
        window.location.replace(LOGIN_URL);
        return;
      }

      try {
        const resposta = await fetch(`${API_URL}/api/me`, {
          headers: {
            "Authorization": `Bearer ${token}`,
            "x-user-email": email
          }
        });

        const data = await resposta.json();

        if (!resposta.ok || !data.ok || !data.usuario) {
          limparSessaoCloud();
          localStorage.setItem("amorSaudeRedirectAfterLogin", HOME_URL);
          window.location.replace(LOGIN_URL);
          return;
        }

        const usuario = data.usuario;
        const nivel = usuario.nivel_acesso || usuario.nivelAcesso || "colaborador";
        const cidade =
          usuario.cidade ||
          localStorage.getItem("amorSaudeCidadeSelecionada") ||
          localStorage.getItem("amor_cidade") ||
          "Cerquilho";

        const usuarioSessao = {
          ...usuario,
          uid: usuario.uid || usuario.id || usuario.email || "cloud-user",
          nivelAcesso: nivel,
          nivel_acesso: nivel,
          cidade,
          authProvider: "cloudflare-d1"
        };

        localStorage.setItem("amor_usuario", JSON.stringify(usuarioSessao));
        localStorage.setItem("amorSaudeUsuario", JSON.stringify(usuarioSessao));
        localStorage.setItem("usuarioLogado", JSON.stringify(usuarioSessao));
        localStorage.setItem("amor_nivel_acesso", nivel);
        localStorage.setItem("nivelAcesso", nivel);
        localStorage.setItem("amor_cidade", cidade);
        localStorage.setItem("cidadeSelecionada", cidade);
        localStorage.setItem("amorSaudeCidadeSelecionada", cidade);

        window.location.replace(HOME_URL);
      } catch (erro) {
        console.error("Erro ao validar sessão Cloudflare:", erro);
        limparSessaoCloud();
        localStorage.setItem("amorSaudeRedirectAfterLogin", HOME_URL);
        window.location.replace(LOGIN_URL);
      }
    }

    iniciar();
  </script>
</body>
</html>
