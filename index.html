<script>
  (function protegerHomeCloudflare() {
    const token = localStorage.getItem("amor_token");
    const usuario =
      localStorage.getItem("amor_usuario") ||
      localStorage.getItem("amorSaudeUsuario") ||
      localStorage.getItem("usuarioLogado");

    if (!token || !usuario) {
      localStorage.setItem("amorSaudeRedirectAfterLogin", "/index.html");
      window.location.replace("/pages/login");
      return;
    }

    try {
      window.usuarioAtualCloudflare = JSON.parse(usuario);
    } catch {
      localStorage.removeItem("amor_token");
      localStorage.removeItem("amor_usuario");
      localStorage.removeItem("amorSaudeUsuario");
      localStorage.removeItem("usuarioLogado");
      window.location.replace("/pages/login");
    }
  })();
</script>
