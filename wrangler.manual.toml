# Use este arquivo somente para conectar um banco D1 que já existe.
# Copie este conteúdo para wrangler.toml e substitua o nome e o UUID abaixo.

name = "amorsaudeexp4"
main = "src/worker.js"
compatibility_date = "2026-07-30"
workers_dev = true
preview_urls = true
keep_vars = true

[observability]
enabled = true
head_sampling_rate = 1.0

[vars]
FREE_EDIT_MODE = "false"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api", "/api/*"]
not_found_handling = "404-page"

[[d1_databases]]
binding = "DB"
database_name = "amorsaudeexp4-db"
database_id = "COLE_AQUI_O_DATABASE_ID_REAL"
