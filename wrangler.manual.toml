name = "amorsaudeexp4"
main = "src/worker.js"
compatibility_date = "2026-07-28"
workers_dev = true
keep_vars = true

[observability]
enabled = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*", "/api", "/pages/login", "/pages/home.html", "/modules/prontuario-medico/prontuario-medico.html", "/"]
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "COLE_AQUI_O_NOME_DO_BANCO_D1"
database_id = "COLE_AQUI_O_ID_DO_BANCO_D1"
