# Use este modelo somente se a Cloudflare pedir database_id no deploy.
# Troque o wrangler.toml por este conteúdo e cole os dados reais do seu banco D1.

name = "amorsaudeexp4"
main = "src/worker.js"
compatibility_date = "2026-07-28"
workers_dev = true
keep_vars = true

[observability]
enabled = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/api"]
not_found_handling = "404-page"

[[d1_databases]]
binding = "DB"
database_name = "COLE_AQUI_O_NOME_DO_BANCO_D1"
database_id = "COLE_AQUI_O_ID_DO_BANCO_D1"
