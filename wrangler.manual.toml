# Use este modelo somente se a Cloudflare pedir database_id no deploy.
# Troque o wrangler.toml por este conteúdo e cole os dados reais do seu banco D1.

name = "amorsaude"
main = "src/worker.js"
compatibility_date = "2026-06-29"
workers_dev = true
keep_vars = true

[observability]
enabled = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/api"]
not_found_handling = "404-page"

[[d1_databases]]
binding = "DB"
database_name = "amorsaudeexp4-db"
database_id = "d3c0be5c-3170-42e0-9339-ecd1d61974fe"
